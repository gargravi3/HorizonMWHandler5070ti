// HorizonMW graphics preset: Minimum
//
// THIS PRESET SAVES NO VIDEO MEMORY. It was written to, and does not. Measured with
// four instances running, per-process Dedicated Usage:
//
//     Low     4 instances, 1440p render   3,791 MiB each   card 15,718 of 16,303
//     Low     4 instances, 540p render    3,806 MiB each   card 15,796
//     Minimum 4 instances, shadows off    3,810 MiB each   card 15,789
//
// Turning shadows off, and before that cutting the render resolution to a seventh of
// the pixels, each changed per-instance video memory by well under 1%. The card ends
// up at 96-97% whatever this file says, which points at the game or the driver
// filling available video memory with evictable caches rather than at a hard
// requirement of ~3.8 GB per instance. It also explains the 2080 Ti that ran four
// instances of this same game in 11 GB: less card, less taken, still worked.
//
// So the premise below was wrong. It read a full card as a shortage, and a black
// screen on the third instance as losing a race for video memory. Keep this preset
// for GPU time if you want it, not for memory, and do not expect it to decide
// whether four instances fit.
//
// Everything here is Low plus the shadow and light settings.
//
// Deliberately NOT included: the cosmetic dvars (fx_marks_smodels, fx_marks_ents,
// fx_flare, cg_brass, ragdoll_enable, ragdoll_max_simulating). They exist and are
// safe, but they cost CPU and draw calls rather than video memory, and bundling
// them would make the measurement impossible to attribute. Add them separately if
// you want them.
//
// Also not included, because they are ALREADY "0" in this install and so save
// nothing: r_mbLimit, r_ssaoLimit, r_mdaoLimit, r_sssLimit, r_dof_limit. And
// r_postAA is already "None", which is cheaper than FXAA, not dearer.

// --- identical to Low ------------------------------------------------------
seta r_picmip "3"
seta r_picmip_bump "3"
seta r_picmip_spec "3"
seta r_picmip_water "1"
seta r_texFilterAnisoMin "1"
seta r_texFilterAnisoMax "1"
seta r_drawWater "0"
seta fx_marks "0"
seta ai_corpseLimit "4"
seta ragdoll_mp_limit "4"
seta r_vsync "0"

// --- the part Low does not do ----------------------------------------------

// Shadows off entirely. This is the largest single saving available, and it is
// also the one setting in this file with a bad history: it is the prime suspect
// for the crash on 1 Aug at 01:30, where the second instance died 6 s into startup
// during D3D11 device creation. It was never proven, and it was suspected during
// the period when the real problem turned out to be commit exhaustion, which has
// since been fixed with a 64 GB pagefile. Retesting it is reasonable now, but if an
// instance dies early into startup, comment this line out first.
seta sm_enable "0"

// Shadow atlas size. THE GAME DOES NOT KEEP THIS VALUE: after a run the config reads
// sm_tileResolution "Auto" in all four instances, not the "Low" written here. The
// value came from a third-party write-up of a different HorizonMW handler rather than
// from this game, and checking it the way r_picmip_water was checked is what caught
// it.
//
// One confound before concluding "Low" is invalid: sm_enable "0" above turns shadows
// off entirely, so the atlas setting is moot and the game may well be normalising a
// setting it has no use for. Testing it properly means putting sm_tileResolution
// "Low" in a preset that leaves sm_enable "1", which has not been done.
//
// Left in place because it is inert either way, and removing it would lose the
// finding.
seta sm_tileResolution "Low"

// No shadow-casting lights at all, where Low allows one.
seta sm_maxLightsWithShadows "0"

// Dynamic light limit, "2" in the install. Dynamic lights that cast shadows are
// the expensive kind, and this is the dvar that caps them.
seta r_dlightForceLimit "0"
