// HorizonMW graphics preset: Extra
//
// Full detail, for 2 instances on a card with headroom. See Low.cfg for the
// format and the editing notes.
//
// sm_tileResolution "High" is included because "High" is the value the game
// itself had in the untouched install config, so it is known to be accepted.
// The lower settings do not touch that dvar, because the names of its other
// levels are not documented and a rejected value is silently ignored.

seta r_picmip "0"
seta r_picmip_bump "0"
seta r_picmip_spec "0"
seta r_picmip_water "0"

seta r_texFilterAnisoMin "1"
seta r_texFilterAnisoMax "16"

seta sm_enable "1"
seta sm_maxLightsWithShadows "4"
seta sm_tileResolution "High"

seta r_drawWater "1"
seta fx_marks "1"
seta ai_corpseLimit "28"
seta ragdoll_mp_limit "32"

seta r_vsync "0"
