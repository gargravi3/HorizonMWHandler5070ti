// HorizonMW graphics preset: Low
//
// For 4 or more instances. Edit freely: every line here is applied to each
// instance's config_mp.cfg, and any dvar not listed is left exactly as it was.
//
// Format is one dvar per line, "seta" optional:
//     seta r_picmip "3"
// Lines starting with // or # are ignored.
//
// Only dvars whose meaning and direction are unambiguous are shipped here. HMW
// also has string-enum graphics dvars (sm_tileResolution, r_postAA,
// r_depthPrepass, sm_cacheSpotShadows, sm_cacheSunShadow) whose accepted values
// are not documented, so they are deliberately left out rather than guessed at.
// To add them safely, set them in-game and run Capture-GraphicsPreset.ps1.
//
// r_fullscreen, r_fullscreenWindow, r_mode, vid_xpos, vid_ypos and name are
// ignored even if added: the handler owns those, and overriding them breaks
// split-screen or crashes an instance during window repositioning.

// Texture detail. 0 is full resolution, higher is blurrier and cheaper.
seta r_picmip "3"
seta r_picmip_bump "3"
seta r_picmip_spec "3"
seta r_picmip_water "3"

// Anisotropic filtering, powers of two.
seta r_texFilterAnisoMin "1"
seta r_texFilterAnisoMax "1"

// Shadows off entirely. Usually the single biggest saving.
seta sm_enable "0"

// Misc detail.
seta r_drawWater "0"
seta fx_marks "0"
seta ai_corpseLimit "4"
seta ragdoll_mp_limit "4"

// Never vsync several instances against one display.
seta r_vsync "0"
